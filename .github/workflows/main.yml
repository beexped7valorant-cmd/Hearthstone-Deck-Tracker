name: Main

on:
  push:
    branches:
      - '**'

defaults:
  run:
    shell: powershell

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1

      - name: Run Bootstrap
        run: ./bootstrap.ps1

      - name: Build (Release)
        run: msbuild "./Hearthstone Deck Tracker.sln" /p:Configuration=Release /p:Platform="x64"

      - name: Setup VSTest
        uses: Malcolmnixon/Setup-VSTest@v4

      - name: Test
        run: |
          vstest.console "HearthWatcher.Test\bin\x64\Release\HearthWatcher.Test.dll"
          $exit1 = $LASTEXITCODE
          vstest.console "HDTTests\bin\x64\Release\HDTTests.dll"
          $exit2 = $LASTEXITCODE
          if ($exit1 -ne 0 -or $exit2 -ne 0) { exit 1 }

      - name: Start the portable tracker on Windows
        if: github.repository == 'beexped7valorant-cmd/Hearthstone-Deck-Tracker'
        run: |
          $portable = Join-Path $env:RUNNER_TEMP "hdt-startup"
          Copy-Item "Hearthstone Deck Tracker/bin/x64/Release" $portable -Recurse
          $tracker = Start-Process (Join-Path $portable "HearthstoneDeckTracker.exe") -WorkingDirectory $portable -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(90)
            do {
              Start-Sleep -Seconds 1
              $tracker.Refresh()
              if ($tracker.HasExited) { throw "Tracker exited with code $($tracker.ExitCode)" }
              if ($tracker.MainWindowTitle -like "Hearthstone Deck Tracker*") { break }
            } while ((Get-Date) -lt $deadline)
            if ($tracker.MainWindowTitle -notlike "Hearthstone Deck Tracker*") {
              throw "Tracker did not reach its main window. Window title was '$($tracker.MainWindowTitle)'"
            }
            Write-Host "Opened $($tracker.MainWindowTitle)"
          } finally {
            if (!$tracker.HasExited) { Stop-Process -Id $tracker.Id }
          }

      - name: Upload portable Battlegrounds tracker
        if: github.repository == 'beexped7valorant-cmd/Hearthstone-Deck-Tracker'
        uses: actions/upload-artifact@v4
        with:
          name: HDT-Battlegrounds-Windows-x64
          path: |
            Hearthstone Deck Tracker/bin/x64/Release/
            !Hearthstone Deck Tracker/bin/x64/Release/**/*.pdb
          if-no-files-found: error

      - name: Build (Velopack)
        run: msbuild "./Hearthstone Deck Tracker.sln" /p:Configuration=Velopack /p:Platform="x64"
